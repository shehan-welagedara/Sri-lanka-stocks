<footer class="footer">
  <div class="wrap footer__in">
    <div>
      <a class="logo logo--light" href="/">
        <span class="logo__mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-6 4 4 7-9"/></svg></span>
        <span class="logo__name">{{brand.name}}</span>
      </a>
      <p class="footer__tag">{{brand.tagline}}</p>
    </div>
    <nav class="footer__links" aria-label="Footer">
      <a href="/#features">Features</a>
      <a href="/#demo">Book a demo</a>
      <a href="/privacy">Privacy policy</a>
      <a href="/terms">Terms</a>
    </nav>
    <div class="footer__contact">
      <span>{{contact.city}}</span>
      {{phoneRow}}
      {{emailRow}}
    </div>
  </div>
  <div class="wrap footer__legal">© {{brand.year}} {{brand.company}}. All rights reserved.</div>
</footer>
<script>window.SITE = {{clientConfig}};</script>
<script src="/app.js" defer></script>
